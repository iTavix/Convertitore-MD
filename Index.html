<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>File to Markdown Converter</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.5.136/pdf.min.js"></script>
<script src="https://unpkg.com/turndown/dist/turndown.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{background:#f5f7fa;color:#222;padding:20px}
.container{max-width:1200px;margin:auto}
h1{margin-bottom:10px}
.subtitle{color:#666;margin-bottom:25px}
.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
.upload{border:2px dashed #ff7a00;border-radius:12px;padding:40px;text-align:center;margin-bottom:20px;transition:.2s}
.upload.dragover{background:#fff4ea;border-color:#ff5e00;transform:scale(1.01)}
button{background:#ff7a00;color:white;border:none;padding:12px 20px;border-radius:10px;cursor:pointer}
.actions{display:flex;gap:10px;margin-top:15px;flex-wrap:wrap}
textarea{width:100%;height:500px;margin-top:20px;padding:15px;border-radius:12px;border:1px solid #ddd;font-family:monospace}
.status{margin-top:15px;color:#555}
</style>
</head>
<body>

<div class="container">
<h1>📄 File → Markdown Converter</h1>
<p class="subtitle">Converti PDF, HTML e JSON in Markdown direttamente dal browser.</p>

<div class="card">

<div class="upload" id="dropZone">
<h3>📂 Trascina qui un file</h3>
<p>oppure selezionalo</p><br>
<input type="file" id="fileInput" accept=".pdf,.html,.htm,.json">
<div id="fileName" style="margin-top:15px;color:#666;">Nessun file selezionato</div>
</div>

<div class="actions">
<button onclick="convertFile()">Converti</button>
<button onclick="downloadMarkdown()">Scarica Markdown</button>
<button onclick="copyMarkdown()">Copia Markdown</button>
</div>

<div class="status" id="status">Pronto.</div>

<textarea id="output" placeholder="Il Markdown apparirà qui..."></textarea>

</div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.5.136/pdf.worker.min.js';

const turndownService=new TurndownService();
let selectedFile=null;

const dropZone=document.getElementById('dropZone');
const fileInput=document.getElementById('fileInput');
const fileName=document.getElementById('fileName');

fileInput.addEventListener('change',(e)=>{
 if(e.target.files.length){
   selectedFile=e.target.files[0];
   fileName.textContent=selectedFile.name;
 }
});

['dragenter','dragover'].forEach(ev=>{
 dropZone.addEventListener(ev,e=>{
  e.preventDefault();
  dropZone.classList.add('dragover');
 });
});

['dragleave','drop'].forEach(ev=>{
 dropZone.addEventListener(ev,e=>{
  e.preventDefault();
  dropZone.classList.remove('dragover');
 });
});

dropZone.addEventListener('drop',e=>{
 const files=e.dataTransfer.files;
 if(files.length){
   selectedFile=files[0];
   const dt=new DataTransfer();
   dt.items.add(selectedFile);
   fileInput.files=dt.files;
   fileName.textContent=selectedFile.name;
 }
});

async function convertFile(){
 const file=selectedFile||fileInput.files[0];
 if(!file){alert('Seleziona un file');return;}

 document.getElementById('status').textContent='Conversione in corso...';

 try{
  const ext=file.name.split('.').pop().toLowerCase();
  let markdown='';

  if(ext==='pdf') markdown=await pdfToMarkdown(file);
  else if(ext==='html'||ext==='htm') markdown=await htmlToMarkdown(file);
  else if(ext==='json') markdown=await jsonToMarkdown(file);
  else throw new Error('Formato non supportato');

  document.getElementById('output').value=markdown;
  document.getElementById('status').textContent='Conversione completata';
 }catch(err){
  document.getElementById('status').textContent='Errore: '+err.message;
 }
}

async function pdfToMarkdown(file){
 const buffer=await file.arrayBuffer();
 const pdf=await pdfjsLib.getDocument({data:buffer}).promise;
 let md='';

 for(let i=1;i<=pdf.numPages;i++){
   const page=await pdf.getPage(i);
   const content=await page.getTextContent();
   md+=`## Pagina ${i}\n\n`;
   md+=content.items.map(x=>x.str).join(' ')+'\n\n';
 }
 return md;
}

async function htmlToMarkdown(file){
 return turndownService.turndown(await file.text());
}

async function jsonToMarkdown(file){
 const json=JSON.parse(await file.text());
 return convertObject(json,1);
}

function convertObject(obj,level){
 let md='';

 if(Array.isArray(obj)){
   obj.forEach(item=>{
      md+='- ';
      md+=typeof item==='object' ? '\n'+convertObject(item,level+1) : item+'\n';
   });
 }else if(typeof obj==='object' && obj!==null){
   Object.entries(obj).forEach(([k,v])=>{
      md+=`${'#'.repeat(level)} ${k}\n\n`;
      md+=typeof v==='object' ? convertObject(v,level+1) : `${v}\n\n`;
   });
 }
 return md;
}

function downloadMarkdown(){
 const text=document.getElementById('output').value;
 const blob=new Blob([text],{type:'text/markdown'});
 const url=URL.createObjectURL(blob);
 const a=document.createElement('a');
 a.href=url;
 a.download='converted.md';
 a.click();
 URL.revokeObjectURL(url);
}

async function copyMarkdown(){
 await navigator.clipboard.writeText(document.getElementById('output').value);
 alert('Markdown copiato');
}
</script>
</body>
</html>
